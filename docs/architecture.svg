<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8D959C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="720" fill="#14171A"/>

  <text x="40" y="42" fill="#E8E6E1" font-size="20" font-weight="600">NEXUS-OT — System Architecture</text>
  <text x="40" y="64" fill="#8D959C" font-size="12">Unified Asset &amp; Operations Brain for Industrial Knowledge Intelligence</text>

  <!-- Layer 1: Sources -->
  <rect x="40" y="95" width="920" height="110" rx="10" fill="none" stroke="#2B3238" stroke-width="1"/>
  <text x="58" y="118" fill="#5C8A6B" font-size="12" font-weight="600">LAYER 1 — HETEROGENEOUS DOCUMENT SOURCES</text>
  <g font-size="11" fill="#E8E6E1">
    <rect x="58" y="132" width="130" height="52" rx="6" fill="#20252A" stroke="#2B3238"/>
    <text x="123" y="155" text-anchor="middle">Maintenance</text><text x="123" y="169" text-anchor="middle" fill="#8D959C" font-size="9.5">logs &amp; work orders</text>

    <rect x="204" y="132" width="130" height="52" rx="6" fill="#20252A" stroke="#2B3238"/>
    <text x="269" y="155" text-anchor="middle">P&amp;IDs &amp;</text><text x="269" y="169" text-anchor="middle" fill="#8D959C" font-size="9.5">engineering drawings</text>

    <rect x="350" y="132" width="130" height="52" rx="6" fill="#20252A" stroke="#2B3238"/>
    <text x="415" y="155" text-anchor="middle">Safety SOPs</text><text x="415" y="169" text-anchor="middle" fill="#8D959C" font-size="9.5">&amp; permits</text>

    <rect x="496" y="132" width="130" height="52" rx="6" fill="#20252A" stroke="#2B3238"/>
    <text x="561" y="155" text-anchor="middle">OISD / Factory Act</text><text x="561" y="169" text-anchor="middle" fill="#8D959C" font-size="9.5">regulatory corpus</text>

    <rect x="642" y="132" width="130" height="52" rx="6" fill="#20252A" stroke="#2B3238"/>
    <text x="707" y="155" text-anchor="middle">Incident &amp;</text><text x="707" y="169" text-anchor="middle" fill="#8D959C" font-size="9.5">inspection reports</text>

    <rect x="788" y="132" width="130" height="52" rx="6" fill="#20252A" stroke="#2B3238"/>
    <text x="853" y="155" text-anchor="middle">OEM manuals</text><text x="853" y="169" text-anchor="middle" fill="#8D959C" font-size="9.5">&amp; spec sheets</text>
  </g>

  <line x1="500" y1="205" x2="500" y2="235" stroke="#8D959C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 2: Ingestion -->
  <rect x="40" y="240" width="920" height="100" rx="10" fill="none" stroke="#2B3238" stroke-width="1"/>
  <text x="58" y="263" fill="#4A93BE" font-size="12" font-weight="600">LAYER 2 — INGESTION &amp; KNOWLEDGE GRAPH CONSTRUCTION</text>
  <g font-size="11" fill="#E8E6E1">
    <rect x="58" y="277" width="200" height="50" rx="6" fill="rgba(74,147,190,0.12)" stroke="#4A93BE"/>
    <text x="158" y="299" text-anchor="middle">OCR / document parsing</text><text x="158" y="313" text-anchor="middle" fill="#8D959C" font-size="9.5">PDF, scans, spreadsheets</text>

    <rect x="290" y="277" width="200" height="50" rx="6" fill="rgba(74,147,190,0.12)" stroke="#4A93BE"/>
    <text x="390" y="299" text-anchor="middle">Entity extraction</text><text x="390" y="313" text-anchor="middle" fill="#8D959C" font-size="9.5">equipment, dates, regs, people</text>

    <rect x="522" y="277" width="200" height="50" rx="6" fill="rgba(74,147,190,0.12)" stroke="#4A93BE"/>
    <text x="622" y="299" text-anchor="middle">Knowledge graph builder</text><text x="622" y="313" text-anchor="middle" fill="#8D959C" font-size="9.5">links entities across docs</text>

    <rect x="754" y="277" width="164" height="50" rx="6" fill="rgba(74,147,190,0.12)" stroke="#4A93BE"/>
    <text x="836" y="299" text-anchor="middle">Vector index</text><text x="836" y="313" text-anchor="middle" fill="#8D959C" font-size="9.5">chunk embeddings</text>
  </g>

  <line x1="500" y1="340" x2="500" y2="370" stroke="#8D959C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 3: Agents -->
  <rect x="40" y="375" width="920" height="140" rx="10" fill="none" stroke="#2B3238" stroke-width="1"/>
  <text x="58" y="398" fill="#8B7EC8" font-size="12" font-weight="600">LAYER 3 — AGENTIC REASONING LAYER</text>
  <g font-size="11" fill="#E8E6E1">
    <rect x="58" y="412" width="205" height="80" rx="6" fill="rgba(139,126,200,0.12)" stroke="#8B7EC8"/>
    <text x="160" y="436" text-anchor="middle">Retrieval agent</text>
    <text x="160" y="452" text-anchor="middle" fill="#8D959C" font-size="9.5">hybrid graph + vector</text>
    <text x="160" y="465" text-anchor="middle" fill="#8D959C" font-size="9.5">search over corpus</text>

    <rect x="292" y="412" width="205" height="80" rx="6" fill="rgba(139,126,200,0.12)" stroke="#8B7EC8"/>
    <text x="394" y="436" text-anchor="middle">Copilot / RAG agent</text>
    <text x="394" y="452" text-anchor="middle" fill="#8D959C" font-size="9.5">grounded Q&amp;A with</text>
    <text x="394" y="465" text-anchor="middle" fill="#8D959C" font-size="9.5">source citations</text>

    <rect x="526" y="412" width="205" height="80" rx="6" fill="rgba(217,142,63,0.12)" stroke="#D98E3F"/>
    <text x="628" y="436" text-anchor="middle" fill="#D98E3F">Compliance &amp; gap agent</text>
    <text x="628" y="452" text-anchor="middle" fill="#8D959C" font-size="9.5">cross-checks procedures</text>
    <text x="628" y="465" text-anchor="middle" fill="#8D959C" font-size="9.5">vs regulatory corpus</text>

    <rect x="760" y="412" width="158" height="80" rx="6" fill="rgba(139,126,200,0.12)" stroke="#8B7EC8"/>
    <text x="839" y="436" text-anchor="middle">RCA / lessons-</text>
    <text x="839" y="452" text-anchor="middle">learned agent</text>
    <text x="839" y="468" text-anchor="middle" fill="#8D959C" font-size="9.5">pattern mining</text>
  </g>

  <line x1="500" y1="515" x2="500" y2="545" stroke="#8D959C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 4: Interfaces -->
  <rect x="40" y="550" width="920" height="100" rx="10" fill="none" stroke="#2B3238" stroke-width="1"/>
  <text x="58" y="573" fill="#5C8A6B" font-size="12" font-weight="600">LAYER 4 — USER INTERFACES</text>
  <g font-size="11" fill="#E8E6E1">
    <rect x="58" y="587" width="270" height="50" rx="6" fill="rgba(92,138,107,0.12)" stroke="#5C8A6B"/>
    <text x="193" y="609" text-anchor="middle">Mobile copilot</text><text x="193" y="623" text-anchor="middle" fill="#8D959C" font-size="9.5">field technicians, on-site</text>

    <rect x="358" y="587" width="270" height="50" rx="6" fill="rgba(92,138,107,0.12)" stroke="#5C8A6B"/>
    <text x="493" y="609" text-anchor="middle">Knowledge graph console</text><text x="493" y="623" text-anchor="middle" fill="#8D959C" font-size="9.5">safety officers, engineers</text>

    <rect x="658" y="587" width="260" height="50" rx="6" fill="rgba(92,138,107,0.12)" stroke="#5C8A6B"/>
    <text x="788" y="609" text-anchor="middle">Compliance dashboard</text><text x="788" y="623" text-anchor="middle" fill="#8D959C" font-size="9.5">QA / regulatory teams</text>
  </g>

  <text x="500" y="700" text-anchor="middle" fill="#5E666D" font-size="10.5">Continuous feedback loop: new documents, incidents &amp; inspections re-enter Layer 1 automatically, keeping the graph current.</text>
</svg>
